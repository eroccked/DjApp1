<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#22396a"/>
            <stop offset=".35" stop-color="#4f5c8e"/>
            <stop offset=".6" stop-color="#b8778a"/>
            <stop offset=".8" stop-color="#f09a76"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5d79a8"/>
            <stop offset="1" stop-color="#26446f"/>
        </linearGradient>
        <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#ffd9c4" stop-opacity=".35"/>
        </linearGradient>
        <linearGradient id="mound" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eaa65e"/>
            <stop offset=".55" stop-color="#3b8a93"/>
            <stop offset="1" stop-color="#245f78"/>
        </linearGradient>

        <g id="cloud">
            <path d="M0 0H150Q140-10 118-8Q108-24 86-17Q72-32 52-19Q32-26 25-9Q8-11 0 0Z" fill="#fff"/>
        </g>
        <g id="pine">
            <rect x="-2" y="-14" width="4" height="16" fill="#4b2f3f"/>
            <path d="M0-120L-22-10H0Z" fill="#f7c45e"/>
            <path d="M0-120L22-10H0Z" fill="#e8873a"/>
        </g>
        <g id="pine2">
            <rect x="-2" y="-14" width="4" height="16" fill="#4b2f3f"/>
            <path d="M0-120L-22-10H0Z" fill="#f2a347"/>
            <path d="M0-120L22-10H0Z" fill="#d6652e"/>
        </g>
        <g id="pineFar">
            <path d="M0-120L-18 0H18Z" fill="#46507f"/>
        </g>
        <g id="treeRed">
            <rect x="-2" y="-32" width="4" height="32" fill="#2c2546"/>
            <circle cx="0" cy="-50" r="28" fill="#c4625f"/>
            <path d="M0-78A28 28 0 0 1 0-22Z" fill="#984a5d"/>
        </g>
        <g id="treeDark">
            <rect x="-2" y="-32" width="4" height="32" fill="#211c38"/>
            <circle cx="0" cy="-50" r="28" fill="#4c4277"/>
            <path d="M0-78A28 28 0 0 1 0-22Z" fill="#362f5c"/>
        </g>

        <g id="forest">
            <use href="#pine" transform="translate(20 655) scale(1.2)"/>
            <use href="#pine2" transform="translate(70 660) scale(1.5)"/>
            <use href="#pine" transform="translate(125 665) scale(2.1)"/>
            <use href="#pine2" transform="translate(180 670) scale(1.7)"/>
            <use href="#pine" transform="translate(232 660) scale(2.4)"/>
            <use href="#pine2" transform="translate(285 675) scale(1.6)"/>
            <use href="#pine" transform="translate(330 680) scale(1.2)"/>
            <use href="#treeDark" transform="translate(25 700) scale(1.15)"/>
            <use href="#treeRed" transform="translate(85 705) scale(1.25)"/>
            <use href="#treeDark" transform="translate(150 702) scale(1.05)"/>
            <use href="#treeRed" transform="translate(215 706) scale(1.3)"/>
            <use href="#treeDark" transform="translate(275 703) scale(1.1)"/>
            <use href="#treeRed" transform="translate(330 706) scale(.95)"/>
            <ellipse cx="110" cy="706" rx="120" ry="20" fill="url(#mound)"/>
            <ellipse cx="300" cy="710" rx="85" ry="15" fill="url(#mound)"/>
        </g>
    </defs>

    <rect width="1440" height="705" fill="url(#sky)"/>

    <g fill="#fff">
        <circle cx="60" cy="40" r="1.4" opacity=".8"/><circle cx="180" cy="110" r="1.2" opacity=".6"/>
        <circle cx="260" cy="30" r="1.6" opacity=".8"/><circle cx="340" cy="150" r="1.1" opacity=".5"/>
        <circle cx="420" cy="70" r="1.5" opacity=".8"/><circle cx="510" cy="20" r="1.2" opacity=".6"/>
        <circle cx="590" cy="120" r="1.4" opacity=".7"/><circle cx="660" cy="55" r="1.1" opacity=".6"/>
        <circle cx="740" cy="160" r="1.3" opacity=".5"/><circle cx="820" cy="35" r="1.6" opacity=".8"/>
        <circle cx="900" cy="100" r="1.2" opacity=".6"/><circle cx="975" cy="25" r="1.4" opacity=".7"/>
        <circle cx="1050" cy="140" r="1.1" opacity=".5"/><circle cx="1130" cy="60" r="1.5" opacity=".8"/>
        <circle cx="1210" cy="180" r="1.2" opacity=".5"/><circle cx="1290" cy="40" r="1.4" opacity=".7"/>
        <circle cx="1370" cy="120" r="1.6" opacity=".8"/><circle cx="1420" cy="210" r="1.1" opacity=".5"/>
        <circle cx="110" cy="220" r="1.1" opacity=".5"/><circle cx="470" cy="230" r="1.2" opacity=".4"/>
        <circle cx="960" cy="240" r="1.1" opacity=".4"/><circle cx="1330" cy="260" r="1.2" opacity=".4"/>
    </g>

    <use href="#cloud" transform="translate(70 120) scale(.9)"/>
    <use href="#cloud" transform="translate(300 230) scale(.8)"/>
    <use href="#cloud" transform="translate(880 175) scale(.95)"/>
    <use href="#cloud" transform="translate(1160 300) scale(.8)"/>

    <g fill="none" stroke="#4a3a5a" stroke-width="3" stroke-linecap="round">
        <path d="M690 300q8-7 14 0q6-7 14 0"/>
        <path d="M740 280q6-5 11 0q5-5 11 0"/>
        <path d="M800 310q7-6 12 0q5-6 12 0"/>
    </g>

    <path d="M0 460Q120 380 240 440T480 360T720 400T960 330T1200 380T1440 300V705H0Z" fill="#8783b0"/>
    <path d="M0 540Q160 430 320 520T640 480T960 520T1280 450T1600 500V705H0Z" fill="#6b699c"/>
    <rect y="480" width="1440" height="225" fill="url(#mist)"/>
    <g>
        <use href="#pineFar" transform="translate(470 650) scale(.45)"/>
        <use href="#pineFar" transform="translate(500 655) scale(.6)"/>
        <use href="#pineFar" transform="translate(530 650) scale(.4)"/>
        <use href="#pineFar" transform="translate(900 650) scale(.5)"/>
        <use href="#pineFar" transform="translate(930 655) scale(.65)"/>
        <use href="#pineFar" transform="translate(960 650) scale(.45)"/>
    </g>
    <path d="M0 615Q200 545 420 600T860 595T1300 570T1740 590V705H0Z" fill="#4c5788"/>

    <use href="#forest"/>
    <use href="#forest" transform="translate(1445 -4) scale(-1 1)"/>

    <rect y="700" width="1440" height="200" fill="url(#water)"/>
    <g opacity=".22" transform="translate(0 1412) scale(1 -1)">
        <use href="#forest"/>
        <use href="#forest" transform="translate(1445 -4) scale(-1 1)"/>
    </g>
    <g fill="#dfe8ff" opacity=".18">
        <rect x="120" y="735" width="260" height="5" rx="2.5"/>
        <rect x="520" y="752" width="420" height="4" rx="2"/>
        <rect x="1040" y="740" width="280" height="5" rx="2.5"/>
        <rect x="60" y="790" width="360" height="4" rx="2"/>
        <rect x="640" y="805" width="220" height="6" rx="3"/>
        <rect x="980" y="820" width="400" height="4" rx="2"/>
        <rect x="260" y="850" width="300" height="5" rx="2.5"/>
    </g>
